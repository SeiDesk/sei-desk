<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><title>Appearance and behavior settings</title><desc>Sei-Desk design planning only. Static vector mockup, not an implemented application.</desc><defs><linearGradient id="sky" x2=".2" y2="1"><stop stop-color="#7A9DCD"/><stop offset=".52" stop-color="#CBC2DE"/><stop offset=".76" stop-color="#F3B8C8"/><stop offset="1" stop-color="#9FBAE0"/></linearGradient><linearGradient id="lake" x2="0" y2="1"><stop stop-color="#AABCD7"/><stop offset="1" stop-color="#7A9DCD"/></linearGradient><filter id="shadow" x="-20%" y="-30%" width="140%" height="170%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#293649" flood-opacity=".13"/></filter></defs><rect width="1600" height="1000" fill="#EFF1F7"/><text x="48" y="54" font-family="Segoe UI, sans-serif" font-size="14" fill="#53647A" font-weight="600">SEI-DESK   /   DESIGN STUDY 07   /   REVIEW DRAFT</text><text x="48" y="108" font-family="Segoe UI, sans-serif" font-size="34" fill="#293649" font-weight="600">Settings · appearance &amp; behavior</text><text x="48" y="143" font-family="Segoe UI, sans-serif" font-size="18" fill="#53647A" font-weight="400">A constrained pastel theme with readable fallbacks and clear operating-system dependencies.</text><rect x="120" y="200" width="1360" height="690" rx="16" fill="#EFF1F7" stroke="#B7C6DA" filter="url(#shadow)"/><rect x="120" y="200" width="220" height="690" rx="16" fill="#E3EAF3" stroke="none" /><g transform="translate(144 224)"><path d="M0 25 12 4 22 25z" fill="#C5E8E3"/><path d="m12 25 15-25 15 25z" fill="#7A9DCD"/><path d="m20 11 7-11 6 11-6-3z" fill="#F4F7FC"/></g><text x="196" y="247" font-family="Segoe UI, sans-serif" font-size="19" fill="#293649" font-weight="600">Sei-Desk</text><text x="1390" y="230" font-family="Segoe UI, sans-serif" font-size="15" fill="#53647A" font-weight="400">−    □    ×</text><g transform="translate(151 280) scale(0.8333333333333334)" stroke="#293649" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M2 2h7v7H2zM15 2h7v7h-7zM2 15h7v7H2zM15 15h7v7h-7z"/></g><text x="185" y="297" font-family="Segoe UI, sans-serif" font-size="16" fill="#293649" font-weight="400">Overview</text><g transform="translate(151 336) scale(0.8333333333333334)" stroke="#293649" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M2 2h7v7H2zM15 2h7v7h-7zM2 15h7v7H2zM15 15h7v7h-7z"/></g><text x="185" y="353" font-family="Segoe UI, sans-serif" font-size="16" fill="#293649" font-weight="400">Applications</text><rect x="136" y="382" width="188" height="44" rx="8" fill="#C5E8E3" stroke="none" /><rect x="136" y="390" width="3" height="28" rx="1" fill="#44638A" stroke="none" /><g transform="translate(151 392) scale(0.8333333333333334)" stroke="#293649" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" fill="none"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/><path d="M12 0v4m0 16v4M0 12h4m16 0h4"/></g><text x="185" y="409" font-family="Segoe UI, sans-serif" font-size="16" fill="#293649" font-weight="600">Settings</text><text x="144" y="835" font-family="Segoe UI, sans-serif" font-size="14" fill="#53647A" font-weight="400">Sei-Desk</text><text x="144" y="858" font-family="Segoe UI, sans-serif" font-size="12" fill="#53647A" font-weight="400">Design preview</text><text x="376" y="280" font-family="Segoe UI, sans-serif" font-size="30" fill="#293649" font-weight="600">Settings</text><text x="376" y="314" font-family="Segoe UI, sans-serif" font-size="16" fill="#53647A" font-weight="400">Appearance and behavior · proposed defaults</text><text x="400" y="361" font-family="Segoe UI, sans-serif" font-size="13" fill="#53647A" font-weight="600">APPEARANCE</text><text x="400" y="397" font-family="Segoe UI, sans-serif" font-size="17" fill="#293649" font-weight="600">Theme</text><text x="400" y="422" font-family="Segoe UI, sans-serif" font-size="13" fill="#53647A" font-weight="400">Reference-derived pastel surfaces</text><rect x="1200" y="376" width="160" height="32" rx="16" fill="#C5E8E3" stroke="#B7C6DA" /><text x="1216" y="398" font-family="Segoe UI, sans-serif" font-size="14" fill="#293649" font-weight="600">Pastel</text><path d="M400 443 L1398 443" stroke="#B7C6DA" stroke-width="1" fill="none"/><text x="400" y="475" font-family="Segoe UI, sans-serif" font-size="17" fill="#293649" font-weight="600">Accent</text><text x="400" y="500" font-family="Segoe UI, sans-serif" font-size="13" fill="#53647A" font-weight="400">Muted mint by default; focus contrast stays consistent</text><rect x="1190" y="452" width="32" height="32" rx="16" fill="#C5E8E3" stroke="#44638A" stroke-width="2"/><rect x="1238" y="452" width="32" height="32" rx="16" fill="#CBC2DE" stroke="#B7C6DA" /><rect x="1286" y="452" width="32" height="32" rx="16" fill="#7A9DCD" stroke="#B7C6DA" /><rect x="1334" y="452" width="32" height="32" rx="16" fill="#F3B8C8" stroke="#B7C6DA" /><path d="M400 521 L1398 521" stroke="#B7C6DA" stroke-width="1" fill="none"/><text x="400" y="553" font-family="Segoe UI, sans-serif" font-size="17" fill="#293649" font-weight="600">Translucent desktop panels</text><text x="400" y="578" font-family="Segoe UI, sans-serif" font-size="13" fill="#53647A" font-weight="400">Opaque surfaces remain available for readability</text><rect x="1330" y="532" width="44" height="24" rx="12" fill="#44638A" stroke="none" /><circle cx="1362" cy="544" r="9" fill="#F4F7FC"/><path d="M400 599 L1398 599" stroke="#B7C6DA" stroke-width="1" fill="none"/><text x="400" y="631" font-family="Segoe UI, sans-serif" font-size="17" fill="#293649" font-weight="600">Reduce motion</text><text x="400" y="656" font-family="Segoe UI, sans-serif" font-size="13" fill="#53647A" font-weight="400">Use immediate transitions</text><rect x="1330" y="610" width="44" height="24" rx="12" fill="#8796AA" stroke="none" /><circle cx="1342" cy="622" r="9" fill="#F4F7FC"/><path d="M400 677 L1398 677" stroke="#B7C6DA" stroke-width="1" fill="none"/><text x="400" y="719" font-family="Segoe UI, sans-serif" font-size="13" fill="#53647A" font-weight="600">BEHAVIOR</text><text x="400" y="758" font-family="Segoe UI, sans-serif" font-size="17" fill="#293649" font-weight="600">Windows key opens Start</text><text x="400" y="783" font-family="Segoe UI, sans-serif" font-size="13" fill="#53647A" font-weight="400">Available after Windows integration is validated</text><rect x="1198" y="738" width="176" height="32" rx="16" fill="#E3EAF3" stroke="#B7C6DA" /><text x="1214" y="760" font-family="Segoe UI, sans-serif" font-size="14" fill="#293649" font-weight="400">Needs validation</text><path d="M400 804 L1398 804" stroke="#B7C6DA" stroke-width="1" fill="none"/><text x="400" y="842" font-family="Segoe UI, sans-serif" font-size="14" fill="#53647A" font-weight="400">Dock and taskbar remain fixed in the initial release. Settings save immediately.</text><path d="M48 946 L1552 946" stroke="#B7C6DA" stroke-width="1" fill="none"/><text x="48" y="977" font-family="Segoe UI, sans-serif" font-size="14" fill="#53647A" font-weight="400">REFERENCE-DERIVED PASTEL SYSTEM  ·  Static design mockup  ·  Values and app entries are illustrative</text><text x="1360" y="977" font-family="Segoe UI, sans-serif" font-size="14" fill="#53647A" font-weight="400">14 OCT 2026</text></svg>
