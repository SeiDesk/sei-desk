<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1260" viewBox="0 0 1600 1260"><title>Auto-hiding dock state specification</title><desc>Static design planning. Dashed geometry and arrows are reviewer annotations, never idle desktop chrome.</desc><defs><linearGradient id="pastel" x2="0" y2="1"><stop stop-color="#7A9DCD"/><stop offset=".65" stop-color="#CBC2DE"/><stop offset="1" stop-color="#F3B8C8"/></linearGradient></defs><rect width="1600" height="1260" fill="#EFF1F7"/><text x="48" y="54" font-family="Segoe UI, sans-serif" font-size="14" fill="#53647A" font-weight="600">SEI-DESK / DESIGN STUDY 09 / AUTO-HIDING DOCK</text><text x="48" y="108" font-family="Segoe UI, sans-serif" font-size="34" fill="#293649" font-weight="600">Dock · six states, one quiet behavior</text><text x="48" y="143" font-family="Segoe UI, sans-serif" font-size="18" fill="#53647A" font-weight="400">Frames show the same pastel dock; motion arrows and timer labels are design annotations only.</text><text x="48" y="195" font-family="Segoe UI, sans-serif" font-size="21" fill="#293649" font-weight="600">01 / Hidden</text><svg x="48" y="213" width="728" height="180" viewBox="0 0 1000 247"><rect width="1000" height="247" fill="url(#pastel)"/><path d="M0 247 160 160 310 215 450 100 600 215 770 130 1000 235V247z" fill="#9FBAE0"/></svg><text x="48" y="423" font-family="Segoe UI, sans-serif" font-size="17" fill="#293649" font-weight="400">No dock, shadow, handle or idle strip.</text><text x="48" y="451" font-family="Segoe UI, sans-serif" font-size="14" fill="#53647A" font-weight="400">Top-edge sensing is invisible and does not consume clicks.</text><text x="824" y="195" font-family="Segoe UI, sans-serif" font-size="21" fill="#293649" font-weight="600">02 / Revealing</text><svg x="824" y="213" width="728" height="180" viewBox="0 0 1000 247"><rect width="1000" height="247" fill="url(#pastel)"/><path d="M0 247 160 160 310 215 450 100 600 215 770 130 1000 235V247z" fill="#9FBAE0"/><g transform="tra