" stroke-width="1" fill="none" /><g transform="translate(1131 212) scale(0.9166666666666666)" stroke="#F4F7FC" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M12 1v11M6 5a9 9 0 1 0 12 0" /></g></g></g><path d="M830 18v45m-8-10 8 10 8-10" stroke="#293649" stroke-width="3" fill="none" /></svg><text x="824" y="423" font-family="Segoe UI, sans-serif" font-size="17" fill="#293649" font-weight="400">180 ms slide down, clipped at monitor top.</text><text x="824" y="451" font-family="Segoe UI, sans-serif" font-size="14" fill="#53647A" font-weight="400">No hover focus steal; reversal uses the current position.</text><text x="48" y="509" font-family="Segoe UI, sans-serif" font-size="21" fill="#293649" font-weight="600">03 / Visible</text><svg x="48" y="527" width="728" height="180" viewBox="0 0 1000 247"><rect width="1000" height="247" fill="url(#pastel)"/><path d="M0 247 160 160 310 215 450 100 600 215 770 130 1000 235V247z" fill="#9FBAE0"/><g transform="translate(204 12) scale(.78)"><g transform="translate(-420 -197)"><rect x="420" y="197" width="760" height="52" rx="12" fill="#293649" stroke="#7188A4" fill-opacity=".91" filter="url(#shadow)" /><g transform="translate(438 209)"><path d="M0 25 12 4 22 25z" fill="#C5E8E3" /><path d="m12 25 15-25 15 25z" fill="#7A9DCD" /><path d="m20 11 7-11 6 11-6-3z" fill="#F4F7FC" /></g><text x="490" y="230" font-family="Segoe UI, sans-serif" font-size="16" fill="#F4F7FC" font-weight="600">Sei-Desk</text><path d="M594 209 L594 237" stroke="#53677F" stroke-width="1" fill="none" /><g transform="translate(614 212) scale(0.9166666666666666)" stroke="#F4F7FC" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" fill="none"><circle cx="12" cy="12" r="4" /><path d="M12 0v4m0 16v4M0 12h4m16 0h4M3 3l3 3m12 12 3 3M3 21l3-3M18 6l3-3" /></g><rect x="652" y="220" width="118" height="6" rx="3" fill="#53677F" stroke="none" /><rect x="652" y="220" width="94" height="6" rx="3" fill="#C5E8E3" stroke="none" /><g transform="translate(797 212) scale(0.9166666666666666)" stroke="#F4F7FC" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M2 9h4l5-4v14l-5-4H2zM15 8q6 4 0 8M18 4q10 8 0 16" /></g><rect x="838" y="220" width="118" height="6" rx="3" fill="#53677F" stroke="none" /><rect x="838" y="220" width="71" height="6" rx="3" fill="#C5E8E3" stroke="none" /><g transform="translate(981 212) scale(0.9166666666666666)" stroke="#F4F7FC" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M2 8q10-10 20 0M5 12q7-7 14 0M9 16q3-3 6 0" /><circle cx="12" cy="20" r="1" /></g><g transform="translate(1022 212) scale(0.9166666666666666)" stroke="#F4F7FC" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M2 6h17v12H2zM21 10v4M5 9h10v6H5z" /></g><text x="1056" y="230" font-family="Segoe UI, sans-serif" font-size="14" fill="#F4F7FC" font-weight="400">87%</text><path d="M1110 209 L1110 237" stroke="#53677F" stroke-width="1" fill="none" /><g transform="translate(1131 212) scale(0.9166666666666666)" stroke="#F4F7FC" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M12 1v11M6 5a9 9 0 1 0 12 0" /></g></g></g></svg><text x="48" y="737" font-family="Segoe UI, sans-serif" font-size="17" fill="#293649" font-weight="400">Pointer over dock: no dismissal timer.</text><text x="48" y="765" font-family="Segoe UI, sans-serif" font-size="14" fill="#53647A" font-weight="400">Only the dock’s actual controls receive pointer input.</text><text x="824" y="509" font-family="Segoe UI, sans-serif" font-size="21" fill="#293649" font-weight="600">04 / Control expanded</text><svg x="824" y="527" width="728" height="180" viewBox="0 0 1000 247"><rect width="1000" height="247" fill="url(#pastel)"/><path d="M0 247 160 160 310 215 450 100 600 215 770 130 1000 235V247z" fill="#9FBAE0"/><g transform="translate(204 12) scale(.78)"><g transform="translate(-420 -197)"><rect x="420" y="197" width="760" height="52" rx="12" fill="#293649" stroke="#7188A4" fill-opacity=".91" filter="url(#shadow)" /><g transform="translate(438 209)"><path d="M0 25 12 4 22 25z" fill="#C5E8E3" /><path d="m12 25 15-25 15 25z" fill="#7A9DCD" /><path d="m20 11 7-11 6 11-6-3z" fill="#F4F7FC" /></g><text x="490" y="230" font-family="Segoe UI, sans-serif" font-size="16" fill="#F4F7FC" font-weight="600">Sei-Desk</text><path d="M594 209 L594 237" stroke="#53677F" stroke-width="1" fill="none" /><g transform="translate(614 212) scale(0.9166666666666666)" stroke="#F4F7FC" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" fill="none"><circle cx="12" cy="12" r="4" /><path d="M12 0v4m0 16v4M0 12h4m16 0h4M3 3l3 3m12 12 3 3M3 21l3-3M18 6l3-3" /></g><rect x="652" y="220" width="118" height="6" rx="3" fill="#53677F" stroke="none" /><rect x="652" y="220" width="94" height="6" rx="3" fill="#C5E8E3" stroke="none" /><g transform="translate(797 212) scale(0.9166666666666666)" stroke="#F4F7FC" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M2 9h4l5-4v14l-5-4H2zM15 8q6 4 0 8M18 4q10 8 0 16" /></g><rect x="838" y="220" width="118" height="6" rx="3" fill="#53677F" stroke="none" /><rect x="838" y="220" width="71" height="6" rx="3" fill="#C5E8E3" stroke="none" /><g transform="translate(981 212) scale(0.9166666666666666)" stroke="#F4F7FC" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M2 8q10-10 20 0M5 12q7-7 14 0M9 16q3-3 6 0" /><circle cx="12" cy="20" r="1" /></g><g transform="translate(1022 212) scale(0.9166666666666666)" stroke="#F4F7FC" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M2 6h17v12H2zM21 10v4M5 9h10v6H5z" /></g><text x="1056" y="230" font-family="Segoe UI, sans-serif" font-size="14" fill="#F4F7FC" font-weight="400">87%</text><path d="M1110 209 L1110 237" stroke="#53677F" stroke-width="1" fill="none" /><g transform="translate(1131 212) scale(0.9166666666666666)" stroke="#F4F7FC" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M12 1v11M6 5a9 9 0 1 0 12 0" /></g></g></g><rect x="495" y="65" width="285" height="145" rx="12" fill="#293649" stroke="#7188A4" /><text x="513" y="94" font-family="Segoe UI, sans-serif" font-size="17" fill="#F4F7FC" font-weight="600">Volume</text><text x="723" y="94" font-family="Segoe UI, sans-serif" font-size="16" fill="#F4F7FC" font-weight="400">60%</text><rect x="513" y="118" width="244" height="6" rx="3" fill="#53647F" stroke="none" /><rect x="513" y="118" width="146" height="6" rx="3" fill="#C5E8E3" stroke="none" /><circle cx="659" cy="121" r="7" fill="#C5E8E3"/><text x="513" y="159" font-family="Segoe UI, sans-serif" font-size="13" fill="#CBD7E6" font-weight="400">Speakers (Realtek Audio)</text><rect x="513" y="175" width="65" height="24" rx="6" fill="#40536B" stroke="#7188A4" /><text x="526" y="191" font-family="Segoe UI, sans-serif" font-size="12" fill="#F4F7FC" font-weight="400">Mute</text></svg><text x="824" y="737" font-family="Segoe UI, sans-serif" font-size="17" fill="#293649" font-weight="400">Dock + panel form one interaction region.</text><text x="824" y="765" font-family="Segoe UI, sans-serif" font-size="14" fill="#53647A" font-weight="400">Slider drag holds visibility, even beyond panel bounds.</text><text x="48" y="823" font-family="Segoe UI, sans-serif" font-size="21" fill="#293649" font-weight="600">05 / Dismissal pending</text><svg x="48" y="841" width="728" height="180" viewBox="0 0 1000 247"><rect width="1000" height="247" fill="url(#pastel)"/><path d="M0 247 160 160 310 215 450 100 600 215 770 130 1000 235V247z" fill="#9FBAE0"/><g transform="translate(204 12) scale(.78)"><g transform="translate(-420 -197)"><rect x="420" y="197" width="760" height="52" rx="12" fill="#293649" stroke="#7188A4" fill-opacity=".91" filter="url(#shadow)" /><g transform="translate(438 209)"><path d="M0 25 12 4 22 25z" fill="#C5E8E3" /><path d="m12 25 15-25 15 25z" fill="#7A9DCD" /><path d="m20 11 7-11 6 11-6-3z" fill="#F4F7FC" /></g><text x="490" y="230" font-family="Segoe UI, sans-serif" font-size="16" fill="#F4F7FC" font-weight="600">Sei-Desk</text><path d="M594 209 L594 237" stroke="#53677F" stroke-width="1" fill="none" /><g transform="translate(614 212) scale(0.9166666666666666)" stroke="#F4F7FC" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" fill="none"><circle cx="12" cy="12" r="4" /><path d="M12 0v4m0 16v4M0 12h4m16 0h4M3 3l3 3m12 12 3 3M3 21l3-3M18 6l3-3" /></g><rect x="652" y="220" width="118" height="6" rx="3" fill="#53677F" stroke="none" /><rect x="652" y="220" width="94" height="6" rx="3" fill="#C5E8E3" stroke="none" /><g transform="translate(797 212) scale(0.9166666666666666)" stroke="#F4F7FC" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M2 9h4l5-4v14l-5-4H2zM15 8q6 4 0 8M18 4q10 8 0 16" /></g><rect x="838" y="220" width="118" height="6" rx="3" fill="#53677F" stroke="none" /><rect x="838" y="220" width="71" height="6" rx="3" fill="#C5E8E3" stroke="none" /><g transform="translate(981 212) scale(0.9166666666666666)" stroke="#F4F7FC" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M2 8q10-10 20 0M5 12q7-7 14 0M9 16q3-3 6 0" /><circle cx="12" cy="20" r="1" /></g><g transform="translate(1022 212) scale(0.9166666666666666)" stroke="#F4F7FC" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M2 6h17v12H2zM21 10v4M5 9h10v6H5z" /></g><text x="1056" y="230" font-family="Segoe UI, sans-serif" font-size="14" fill="#F4F7FC" font-weight="400">87%</text><path d="M1110 209 L1110 237" stroke="#53677F" stroke-width="1" fill="none" /><g transform="translate(1131 212) scale(0.9166666666666666)" stroke="#F4F7FC" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M12 1v11M6 5a9 9 0 1 0 12 0" /></g></g></g><text x="811" y="36" font-family="Segoe UI, sans-serif" font-size="18" fill="#293649" font-weight="600">450 ms</text></svg><text x="48" y="1051" font-family="Segoe UI, sans-serif" font-size="17" fill="#293649" font-weight="400">After leaving all regions: wait 450 ms.</text><text x="48" y="1079" font-family="Segoe UI, sans-serif" font-size="14" fill="#53647A" font-weight="400">Return before expiry cancels dismissal; no visible countdown.</text><text x="824" y="823" font-family="Segoe UI, sans-serif" font-size="21" fill="#293649" font-weight="600">06 / Hiding</text><svg x="824" y="841" width="728" height="180" viewBox="0 0 1000 247"><rect width="1000" height="247" fill="url(#pastel)"/><path d="M0 247 160 160 310 215 450 100 600 215 770 130 1000 235V247z" fill="#9FBAE0"/><g transform="translate(204 -14) scale(.78)"><g transform="translate(-420 -197)"><rect x="420" y="197" width="760" height="52" rx="12" fill="#293649" stroke="#7188A4" fill-opacity=".91" filter="url(#shadow)" /><g transform="translate(438 209)"><path d="M0 25 12 4 22 25z" fill="#C5E8E3" /><path d="m12 25 15-25 15 25z" fill="#7A9DCD" /><path d="m20 11 7-11 6 11-6-3z" fill="#F4F7FC" /></g><text x="490" y="230" font-family="Segoe UI, sans-serif" font-size="16" fill="#F4F7FC" font-weight="600">Sei-Desk</text><path d="M594 209 L594 237" stroke="#53677F" stroke-width="1" fill="none" /><g transform="translate(614 212) scale(0.9166666666666666)" stroke="#F4F7FC" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" fill="none"><circle cx="12" cy="12" r="4" /><path d="M12 0v4m0 16v4M0 12h4m16 0h4M3 3l3 3m12 12 3 3M3 21l3-3M18 6l3-3" /></g><rect x="652" y="220" width="118" height="6" rx="3" fill="#53677F" stroke="none" /><rect x="652" y="220" width="94" height="6" rx="3" fill="#C5E8E3" stroke="none" /><g transform="translate(797 212) scale(0.9166666666666666)" stroke="#F4F7FC" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M2 9h4l5-4v14l-5-4H2zM15 8q6 4 0 8M18 4q10 8 0 16" /></g><rect x="838" y="220" width="118" height="6" rx="3" fill="#53677F" stroke="none" /><rect x="838" y="220" width="71" height="6" rx="3" fill="#C5E8E3" stroke="none" /><g transform="translate(981 212) scale(0.9166666666666666)" stroke="#F4F7FC" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M2 8q10-10 20 0M5 12q7-7 14 0M9 16q3-3 6 0" /><circle cx="12" cy="20" r="1" /></g><g transform="translate(1022 212) scale(0.9166666666666666)" stroke="#F4F7FC" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M2 6h17v12H2zM21 10v4M5 9h10v6H5z" /></g><text x="1056" y="230" font-family="Segoe UI, sans-serif" font-size="14" fill="#F4F7FC" font-weight="400">87%</text><path d="M1110 209 L1110 237" stroke="#53677F" stroke-width="1" fill="none" /><g transform="translate(1131 212) scale(0.9166666666666666)" stroke="#F4F7FC" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M12 1v11M6 5a9 9 0 1 0 12 0" /></g></g></g><path d="M830 63V18m-8 10 8-10 8 10" stroke="#293649" stroke-width="3" fill="none" /></svg><text x="824" y="1051" font-family="Segoe UI, sans-serif" font-size="17" fill="#293649" font-weight="400">180 ms slide up until completely out of view.</text><text x="824" y="1079" font-family="Segoe UI, sans-serif" font-size="14" fill="#53647A" font-weight="400">Re-entry reverses smoothly; no residual strip or hitbox.</text><rect x="48" y="1150" width="1504" height="78" rx="12" fill="#E3EAF3" stroke="#B7C6DA" /><text x="72" y="1181" font-family="Segoe UI, sans-serif" font-size="20" fill="#293649" font-weight="600">FLOW  Hidden → Revealing → Visible ↔ Expanded → Pending → Hiding → Hidden</text><text x="72" y="1208" font-family="Segoe UI, sans-serif" font-size="16" fill="#53647A" font-weight="400">Keyboard interaction and confirmation dialogs suspend auto-hide. Reduced motion skips the slide, not the delay.</text></svg>