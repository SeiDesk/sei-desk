<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><title>Future optimization concept</title><desc>Sei-Desk design planning only. Static vector mockup, not an implemented application.</desc><defs><linearGradient id="sky" x2=".2" y2="1"><stop stop-color="#7A9DCD"/><stop offset=".52" stop-color="#CBC2DE"/><stop offset=".76" stop-color="#F3B8C8"/><stop offset="1" stop-color="#9FBAE0"/></linearGradient><linearGradient id="lake" x2="0" y2="1"><stop stop-color="#AABCD7"/><stop offset="1" stop-color="#7A9DCD"/></linearGradient><filter id="shadow" x="-20%" y="-30%" width="140%" height="170%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#293649" flood-opacity=".13"/></filter></defs><rect width="1600" height="1000" fill="#EFF1F7"/><text x="48" y="54" font-family="Segoe UI, sans-serif" font-size="14" fill="#53647A" font-weight="600">SEI-DESK   /   DESIGN STUDY 08   /   REVIEW DRAFT</text><text x="48" y="108" font-family="Segoe UI, sans-serif" font-size="34" fill="#293649" font-weight="600">Optimization center · future concept</text><text x="48" y="143" font-family="Segoe UI, sans-serif" font-size="18" fill="#53647A" font-weight="400">OUT OF SCOPE FOR INITIAL RELEASE · no tweaks are implemented or recommended here.</text><rect x="72" y="190" width="1456" height="64" rx="12" fill="#CBC2DE" stroke="#B7C6DA" /><text x="96" y="230" font-family="Segoe UI, sans-serif" font-size="20" fill="#293649" font-weight="600">Concept only — changes require explicit selection, review, and a defined recovery path.</text><rect x="72" y="280" width="680" height="362" rx="12" fill="#EFF1F7" stroke="#B7C6DA" /><text x="96" y="321" font-family="Segoe UI, sans-serif" font-size="23" fill="#293649" font-weight="600">1 / Choose proposed changes</text><rect x="96" y="342" width="105" height="32" rx="16" fill="#C5E8E3" stroke="#B7C6DA" /><text x="112" y="364" font-family="Segoe UI, sans-serif" font-size="14" fill="#293649" font-weight="600">Privacy</text><rect x="213" y="342" width="105" height="32" rx="16" fill="#E3EAF3" stroke="#B7C6DA" /><text x="229" y="364" font-family="Segoe UI, sans-serif" font-size="14" fill="#293649" font-weight="400">Startup</text><rect x="330" y="342" width="105" height="32" rx="16" fill="#E3EAF3" stroke="#B7C6DA" /><text x="346" y="364" font-family="Segoe UI, sans-serif" font-size="14" fill="#293649" font-weight="400">Services</text><rect x="96" y="400" width="632" height="139" rx="10" fill="#E3EAF3" stroke="#B7C6DA" /><rect x="112" y="419" width="22" height="22" rx="4" fill="#C5E8E3" stroke="#44638A" /><g transform="translate(114 421) scale(0.75)" stroke="#44638A" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="m4 12 5 5L21 5"/></g><text x="152" y="438" font-family="Segoe UI, sans-serif" font-size="19" fill="#293649" font-weight="600">Example change A</text><text x="112" y="476" font-family="Segoe UI, sans-serif" font-size="15" fill="#53647A" font-weight="400">Description, affected setting, tradeoff and restart need.</text><text x="112" y="510" font-family="Segoe UI, sans-serif" font-size="14" fill="#53647A" font-weight="400">Current value → proposed value  ·  Recovery instructions</text><text x="96" y="583" font-family="Segoe UI, sans-serif" font-size="16" fill="#53647A" font-weight="400">Nothing selected by default. No “optimize all” action.</text><rect x="516" y="581" width="160" height="32" rx="16" fill="#C5E8E3" stroke="#B7C6DA" /><text x="532" y="603" font-family="Segoe UI, sans-serif" font-size="14" fill="#293649" font-weight="600">Review 1</text><rect x="792" y="280" width="736" height="362" rx="12" fill="#EFF1F7" stroke="#B7C6DA" /><text x="816" y="321" font-family="Segoe UI, sans-serif" font-size="23" fill="#293649" font-weight="600">2 / Review before applying</text><text x="816" y="371" font-family="Segoe UI, sans-serif" font-size="16" fill="#53647A" font-weight="400">1 change selected · administrator permission may be needed</text><path d="M816 391 L1504 391" stroke="#B7C6DA" stroke-width="1" fill="none"/><text x="816" y="428" font-family="Segoe UI, sans-serif" font-size="19" fill="#293649" font-weight="600">Example change A</text><text x="816" y="465" font-family="Segoe UI, sans-serif" font-size="16" fill="#293649" font-weight="400">Before: current setting   →   After: proposed setting</text><text x="816" y="503" font-family="Segoe UI, sans-serif" font-size="16" fill="#53647A" font-weight="400">Impact, risks and recovery must be explained here.</text><rect x="816" y="581" width="100" height="32" rx="16" fill="#E3EAF3" stroke="#B7C6DA" /><text x="832" y="603" font-family="Segoe UI, sans-serif" font-size="14" fill="#293649" font-weight="400">Back</text><rect x="1304" y="581" width="200" height="32" rx="16" fill="#C5E8E3" stroke="#B7C6DA" /><text x="1320" y="603" font-family="Segoe UI, sans-serif" font-size="14" fill="#293649" font-weight="600">Apply 1 change</text><rect x="72" y="674" width="680" height="210" rx="12" fill="#E3EAF3" stroke="#B7C6DA" /><text x="96" y="716" font-family="Segoe UI, sans-serif" font-size="22" fill="#293649" font-weight="600">3 / Applying</text><text x="96" y="752" font-family="Segoe UI, sans-serif" font-size="17" fill="#293649" font-weight="400">Applying change 1 of 1…</text><rect x="96" y="779" width="632" height="7" rx="3" fill="#C6D0E0" stroke="none" /><rect x="96" y="779" width="316" height="7" rx="3" fill="#44638A" stroke="none" /><text x="96" y="838" font-family="Segoe UI, sans-serif" font-size="14" fill="#53647A" font-weight="400">Show each result; cancellation stops before the next change.</text><rect x="792" y="674" width="736" height="210" rx="12" fill="#E3EAF3" stroke="#B7C6DA" /><text x="816" y="716" font-family="Segoe UI, sans-serif" font-size="22" fill="#293649" font-weight="600">4 / Partial failure &amp; recovery</text><text x="816" y="752" font-family="Segoe UI, sans-serif" font-size="16" fill="#293649" font-weight="400">Could not apply Example change A. Original value retained.</text><text x="816" y="789" font-family="Segoe UI, sans-serif" font-size="15" fill="#53647A" font-weight="400">Show cause, completed changes and per-change recovery.</text><rect x="816" y="822" width="145" height="32" rx="16" fill="#E3EAF3" stroke="#B7C6DA" /><text x="832" y="844" font-family="Segoe UI, sans-serif" font-size="14" fill="#293649" font-weight="400">View details</text><rect x="978" y="822" width="190" height="32" rx="16" fill="#C5E8E3" stroke="#B7C6DA" /><text x="994" y="844" font-family="Segoe UI, sans-serif" font-size="14" fill="#293649" font-weight="600">Recovery guidance</text><path d="M48 946 L1552 946" stroke="#B7C6DA" stroke-width="1" fill="none"/><text x="48" y="977" font-family="Segoe UI, sans-serif" font-size="14" fill="#53647A" font-weight="400">REFERENCE-DERIVED PASTEL SYSTEM  ·  Static design mockup  ·  Values and app entries are illustrative</text><text x="1360" y="977" font-family="Segoe UI, sans-serif" font-size="14" fill="#53647A" font-weight="400">14 OCT 2026</text></svg>
