scale(0.9166666666666666)" stroke="#F4F7FC" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" fill="none"><circle cx="12" cy="12" r="4" /><path d="M12 0v4m0 16v4M0 12h4m16 0h4M3 3l3 3m12 12 3 3M3 21l3-3M18 6l3-3" /></g><text x="132" y="393" font-family="Segoe UI, sans-serif" font-size="18" fill="#F4F7FC" font-weight="600">Brightness</text><text x="422" y="393" font-family="Segoe UI, sans-serif" font-size="18" fill="#F4F7FC" font-weight="400">80%</text><rect x="96" y="438" width="392" height="6" rx="3" fill="#53677F" stroke="none" /><rect x="96" y="438" width="313.6" height="6" rx="3" fill="#C5E8E3" stroke="none" /><circle cx="409.6" cy="441" r="8" fill="#C5E8E3" /><text x="96" y="493" font-family="Segoe UI, sans-serif" font-size="15" fill="#F4F7FC" font-weight="400">Built-in display</text><text x="96" y="529" font-family="Segoe UI, sans-serif" font-size="13" fill="#CBD7E6" font-weight="400">External display controls may be unavailable.</text><rect x="568" y="350" width="440" height="238" rx="12" fill="#293649" stroke="#7188A4" filter="url(#shadow)" /><g transform="translate(592 374) scale(0.9166666666666666)" stroke="#F4F7FC" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M2 9h4l5-4v14l-5-4H2zM15 8q6 4 0 8M18 4q10 8 0 16" /></g><text x="628" y="393" font-family="Segoe UI, sans-serif" font-size="18" fill="#F4F7FC" font-weight="600">Volume</text><text x="918" y="393" font-family="Segoe UI, sans-serif" font-size="18" fill="#F4F7FC" font-weight="400">60%</text><rect x="592" y="438" width="392" height="6" rx="3" fill="#53677F" stroke="none" /><rect x="592" y="438" width="235.2" height="6" rx="3" fill="#C5E8E3" stroke="none" /><circle cx="827.2" cy="441" r="8" fill="#C5E8E3" /><text x="592" y="493" font-family="Segoe UI, sans-serif" font-size="15" fill="#F4F7FC" font-weight="400">Speakers (Realtek Audio)</text><rect x="592" y="513" width="106" height="40" rx="8" fill="#40536B" stroke="#7188A4" /><text x="617" y="539"