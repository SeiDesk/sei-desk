<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><title>Dock and quick-control panels</title><desc>Sei-Desk design planning only. Static vector mockup, not an implemented application.</desc><defs><linearGradient id="sky" x2=".2" y2="1"><stop stop-color="#7A9DCD" /><stop offset=".52" stop-color="#CBC2DE" /><stop offset=".76" stop-color="#F3B8C8" /><stop offset="1" stop-color="#9FBAE0" /></linearGradient><linearGradient id="lake" x2="0" y2="1"><stop stop-color="#AABCD7" /><stop offset="1" stop-color="#7A9DCD" /></linearGradient><filter id="shadow" x="-20%" y="-30%" width="140%" height="170%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#293649" flood-opacity=".13" /></filter></defs><rect width="1600" height="1000" fill="#EFF1F7" /><text x="48" y="54" font-family="Segoe UI, sans-serif" font-size="14" fill="#53647A" font-weight="600">SEI-DESK   /   DESIGN STUDY 04   /   REVIEW DRAFT</text><text x="48" y="108" font-family="Segoe UI, sans-serif" font-size="34" fill="#293649" font-weight="600">Quick controls · one action away</text><text x="48" y="143" font-family="Segoe UI, sans-serif" font-size="18" fill="#53647A" font-weight="400">Shown after reveal. Pointer, keyboard use and slider capture hold the dock open; confirmations never time out.</text><rect x="420" y="197" width="760" height="52" rx="12" fill="#293649" stroke="#7188A4" fill-opacity=".91" filter="url(#shadow)" /><g transform="translate(438 209)"><path d="M0 25 12 4 22 25z" fill="#C5E8E3" /><path d="m12 25 15-25 15 25z" fill="#7A9DCD" /><path d="m20 11 7-11 6 11-6-3z" fill="#F4F7FC" /></g><text x="490" y="230" font-family="Segoe UI, sans-serif" font-size="16" fill="#F4F7FC" font-weight="600">Sei-Desk</text><path d="M594 209 L594 237" stroke="#53677F" stroke-width="1" fill="none" /><g transform="translate(614 212) scale(0.9166666666666666)" stroke="#F4F7FC" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" fill="none"><circle cx="12" cy="12"