ll="#53647A" font-weight="400">Save your work before restarting.</text><rect x="96" y="789" width="120" height="32" rx="16" fill="#E3EAF3" stroke="#44638A" stroke-width="2" /><text x="112" y="811" font-family="Segoe UI, sans-serif" font-size="14" fill="#293649" font-weight="400">Cancel</text><rect x="232" y="789" width="120" height="32" rx="16" fill="#C5E8E3" stroke="#B7C6DA" /><text x="248" y="811" font-family="Segoe UI, sans-serif" font-size="14" fill="#293649" font-weight="600">Restart</text><text x="868" y="728" font-family="Segoe UI, sans-serif" font-size="18" fill="#293649" font-weight="600">Unavailable / no hardware support</text><rect x="868" y="754" width="660" height="104" rx="12" fill="#E3EAF3" stroke="#B7C6DA" /><text x="892" y="790" font-family="Segoe UI, sans-serif" font-size="17" fill="#53647A" font-weight="400">Brightness unavailable for this display</text><text x="892" y="822" font-family="Segoe UI, sans-serif" font-size="14" fill="#53647A" font-weight="400">The dock remains usable. Unsupported slider is disabled.</text><path d="M48 946 L1552 946" stroke="#B7C6DA" stroke-width="1" fill="none" /><text x="48" y="977" font-family="Segoe UI, sans-serif" font-size="14" fill="#53647A" font-weight="400">REFERENCE-DERIVED PASTEL SYSTEM  ·  Static design mockup  ·  Values and app entries are illustrative</text><text x="1360" y="977" font-family="Segoe UI, sans-serif" font-size="14" fill="#53647A" font-weight="400">14 OCT 2026</text></svg>