<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><title>Expanded dock, keyboard and confirmation protection</title><desc>Static design planning. Dashed geometry and arrows are reviewer annotations, never idle desktop chrome.</desc><defs><linearGradient id="pastel" x2="0" y2="1"><stop stop-color="#7A9DCD"/><stop offset=".65" stop-color="#CBC2DE"/><stop offset="1" stop-color="#F3B8C8"/></linearGradient></defs><rect width="1600" height="1000" fill="#EFF1F7"/><text x="48" y="54" font-family="Segoe UI, sans-serif" font-size="14" fill="#53647A" font-weight="600">SEI-DESK / DESIGN STUDY 10 / AUTO-HIDING DOCK</text><text x="48" y="108" font-family="Segoe UI, sans-serif" font-size="34" fill="#293649" font-weight="600">Expanded volume · protected interaction</text><text x="48" y="143" font-family="Segoe UI, sans-serif" font-size="18" fill="#53647A" font-weight="400">Anchored panel, visible focus and safe pointer travel keep quick adjustments predictable.</text><rect x="48" y="180" width="1504" height="504" rx="0" fill="url(#pastel)" stroke="none" /><g transform="translate(420 196)"><g transform="translate(-420 -197)"><rect x="420" y="197" width="760" height="52" rx="12" fill="#293649" stroke="#7188A4" fill-opacity=".91" filter="url(#shadow)" /><g transform="translate(438 209)"><path d="M0 25 12 4 22 25z" fill="#C5E8E3" /><path d="m12 25 15-25 15 25z" fill="#7A9DCD" /><path d="m20 11 7-11 6 11-6-3z" fill="#F4F7FC" /></g><text x="490" y="230" font-family="Segoe UI, sans-serif" font-size="16" fill="#F4F7FC" font-weight="600">Sei-Desk</text><path d="M594 209 L594 237" stroke="#53677F" stroke-width="1" fill="none" /><g transform="translate(614 212) scale(0.9166666666666666)" stroke="#F4F7FC" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" fill="none"><circle cx="12" cy="12" r="4" /><path d="M12 0v4m0 16v4M0 12h4m16 0h4M3 3l3 3m12 12 3 3M3 21l3-3M18 6l3-3" /></g><rect x="652" y="220" width="118" height="6" rx="3" fill="#53677F" stroke="none" /><rect x="652" y="220" width="94" height="6" rx="3" fill="#C5E8E3" stroke="none" /><g transform="translate(797 212) scale(0.9166666666666666)" stroke="#F4F7FC" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M2 9h4l5-4v14l-5-4H2zM15 8q6 4 0 8M18 4q10 8 0 16" /></g><rect x="838" y="220" width="118" height="6" rx="3" fill="#53677F" stroke="none" /><rect x="838" y="220" width="71" height="6" rx="3" fill="#C5E8E3" stroke="none" /><g transform="translate(981 212) scale(0.9166666666666666)" stroke="#F4F7FC" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M2 8q10-10 20 0M5 12q7-7 14 0M9 16q3-3 6 0" /><circle cx="12" cy="20" r="1" /></g><g transform="translate(1022 212) scale(0.9166666666666666)" stroke="#F4F7FC" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M2 6h17v12H2zM21 10v4M5 9h10v6H5z" /></g><text x="1056" y="230" font-family="Segoe UI, sans-serif" font-size="14" fill="#F4F7FC" font-weight="400">87%</text><path d="M1110 209 L1110 237" stroke="#53677F" stroke-width="1" fill="none" /><g transform="translate(1131 212) scale(0.9166666666666666)" stroke="#F4F7FC" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M12 1v11M6 5a9 9 0 1 0 12 0" /></g></g></g><rect x="791" y="204" width="36" height="36" rx="7" fill="none" stroke="#C5E8E3" stroke-width="1.5"/><path d="M804 243l5 5 5-5" stroke="#C5E8E3" stroke-width="2" fill="none" /><rect x="764" y="256" width="380" height="270" rx="12" fill="#293649" stroke="#7188A4" /><text x="788" y="297" font-family="Segoe UI, sans-serif" font-size="21" fill="#F4F7FC" font-weight="600">Volume</text><text x="1060" y="297" font-family="Segoe UI, sans-serif" font-size="20" fill="#F4F7FC" font-weight="400">60%</text><rect x="788" y="334" width="332" height="6" rx="3" fill="#53677F" stroke="none" /><rect x="788" y="334" width="199" height="6" rx="3" fill="#C5E8E3" stroke="none" /><circle cx="987" cy="337" r="9" fill="#C5E8E3"/><rect x="781" y="323" width="346" height="28" rx="8" fill="none" stroke="#F4F7FC" stroke-width="2"/><text x="788" y="388" font-family="Segoe UI, sans-serif" font-size="17" fill="#F4F7FC" font-weight="400">Speakers (Realtek Audio)</text><rect x="788" y="413" width="98" height="38" rx="8" fill="#40536B" stroke="#7188A4" /><text x="811" y="438" font-family="Segoe UI, sans-serif" font-size="15" fill="#F4F7FC" font-weight="400">Mute</text><text x="904" y="438" font-family="Segoe UI, sans-serif" font-size="13" fill="#CBD7E6" font-weight="400">Space toggles mute</text><text x="788" y="490" font-family="Segoe UI, sans-serif" font-size="14" fill="#CBD7E6" font-weight="400">← → Adjust  ·  Esc Close panel</text><text x="88" y="286" font-family="Segoe UI, sans-serif" font-size="24" fill="#293649" font-weight="600">Hold the dock open</text><text x="88" y="325" font-family="Segoe UI, sans-serif" font-size="19" fill="#293649" font-weight="400">• Pointer in dock or panel</text><text x="88" y="360" font-family="Segoe UI, sans-serif" font-size="19" fill="#293649" font-weight="400">• Active slider drag, anywhere</text><text x="88" y="395" font-family="Segoe UI, sans-serif" font-size="19" fill="#293649" font-weight="400">• Keyboard interaction session</text><text x="88" y="430" font-family="Segoe UI, sans-serif" font-size="19" fill="#293649" font-weight="400">• Power confirmation still open</text><text x="1190" y="299" font-family="Segoe UI, sans-serif" font-size="18" fill="#293649" font-weight="600">8 DIP bridge</text><text x="1190" y="329" font-family="Segoe UI, sans-serif" font-size="15" fill="#53647A" font-weight="400">Travel does not dismiss.</text><path d="M1180 310 1147 310 1147 252 820 252" stroke="#44638A" stroke-width="1.5" fill="none" stroke-dasharray="5 4"/><text x="88" y="471" font-family="Segoe UI, sans-serif" font-size="14" fill="#53647A">Pale ring: slider focus. Mint outline: expanded control.</text><text x="88" y="601" font-family="Segoe UI, sans-serif" font-size="18" fill="#293649" font-weight="600">Top edge: one physical pixel high, centered over the dock’s width. No visible activation strip.</text><text x="88" y="633" font-family="Segoe UI, sans-serif" font-size="17" fill="#53647A" font-weight="400">Hover preserves app focus. Ctrl+Alt+Q is a proposed shortcut; validate conflicts before enabling it.</text><rect x="48" y="720" width="720" height="220" rx="12" fill="#E3EAF3" stroke="#B7C6DA" /><text x="72" y="760" font-family="Segoe UI, sans-serif" font-size="23" fill="#293649" font-weight="600">Keyboard route</text><text x="72" y="797" font-family="Segoe UI, sans-serif" font-size="18" fill="#293649" font-weight="400">Reveal → first enabled control receives focus.</text><text x="72" y="830" font-family="Segoe UI, sans-serif" font-size="17" fill="#53647A" font-weight="400">Tab / Shift+Tab moves between controls; Enter opens.</text><text x="72" y="863" font-family="Segoe UI, sans-serif" font-size="17" fill="#53647A" font-weight="400">Esc closes panel, then dock; restore the prior app.</text><text x="72" y="903" font-family="Segoe UI, sans-serif" font-size="16" fill="#53647A" font-weight="400">No inactivity timeout while keyboard interaction continues.</text><rect x="800" y="720" width="752" height="220" rx="12" fill="#E3EAF3" stroke="#B7C6DA" /><text x="824" y="760" font-family="Segoe UI, sans-serif" font-size="23" fill="#293649" font-weight="600">Confirmation remains until explicitly resolved</text><text x="824" y="797" font-family="Segoe UI, sans-serif" font-size="18" fill="#293649" font-weight="400">Pointer leave and the 450 ms timer cannot close it.</text><text x="824" y="830" font-family="Segoe UI, sans-serif" font-size="17" fill="#53647A" font-weight="400">Cancel starts focused; Escape cancels; outside click is ignored.</text><text x="824" y="863" font-family="Segoe UI, sans-serif" font-size="17" fill="#53647A" font-weight="400">No auto-dismiss on app switch or pointer movement.</text><text x="824" y="903" font-family="Segoe UI, sans-serif" font-size="16" fill="#53647A" font-weight="400">Reduced motion: immediate reveal/hide, unchanged focus rules.</text></svg>