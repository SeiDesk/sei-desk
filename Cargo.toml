[workspace]
members = ["crates/sei-desk", "crates/sei-windows"]
exclude = ["experiments/windows-integration-spike"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.88"
version = "0.1.0"
publish = false

[workspace.dependencies]
iced = { version = "=0.14.0", default-features = false, features = ["tiny-skia", "thread-pool", "crisp", "advanced"] }
sei-windows = { path = "crates/sei-windows" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
