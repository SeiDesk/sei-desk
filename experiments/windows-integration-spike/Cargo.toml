[package]
name = "sei-windows-integration-spike"
version = "0.1.0"
edition = "2024"
publish = false

# Standalone experiment; deliberately not a production/root workspace.
[workspace]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm",
    "Win32_Security", "Win32_System_Threading", "Win32_System_ProcessStatus",
    "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging",
    "Win32_System_Console",
    "Win32_UI_HiDpi", "Win32_UI_Accessibility", "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell",
] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
